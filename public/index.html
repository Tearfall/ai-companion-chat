<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companion Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#db2777" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Companion" />
</head>
<body>
  <div id="persona-list-screen" class="screen hidden">
    <div class="persona-list-card">
      <h1>Your companions</h1>
      <div id="persona-cards" class="persona-cards"></div>
      <button id="new-persona-btn" class="new-persona-btn">+ New persona</button>
      <button id="settings-btn" class="secondary-btn">&#9881; Instructions for all companions</button>
    </div>
  </div>

  <div id="settings-screen" class="screen hidden">
    <div class="setup-card">
      <h1>Instructions</h1>
      <p class="hint">Every companion sees these with every message you send.</p>

      <label for="user-context-input">About you</label>
      <textarea id="user-context-input" rows="5" maxlength="2000" placeholder="e.g. Call me Sam. I'm a nursing student, I get anxious before exams, and I love K-dramas and late-night ramen."></textarea>

      <label for="instructions-input">How companions should respond</label>
      <textarea id="instructions-input" rows="5" maxlength="2000" placeholder="e.g. Keep replies short and casual. Use emojis now and then. Don't give advice unless I ask for it."></textarea>

      <button id="settings-save-btn">Save</button>
      <button id="settings-back-btn" class="secondary-btn">Back</button>
      <p id="settings-error" class="error"></p>
    </div>
  </div>

  <div id="setup-screen" class="screen hidden">
    <div class="setup-card">
      <h1 id="setup-title">Create your companion</h1>

      <label for="name-input">Name</label>
      <input id="name-input" type="text" placeholder="e.g. Luna" maxlength="40" />

      <label for="persona-input">Personality &amp; backstory</label>
      <textarea id="persona-input" rows="5" placeholder="e.g. Warm, playful, curious about the user's day. Loves astronomy and bad puns. Grew up near the coast."></textarea>

      <label>Avatar</label>
      <div id="avatar-grid" class="avatar-grid"></div>

      <button id="save-btn">Start chatting</button>
      <button id="back-btn" class="secondary-btn hidden">Back</button>
      <p id="setup-error" class="error"></p>

      <div id="danger-zone" class="danger-zone hidden">
        <button id="reset-btn" class="reset-persona-btn">Reset conversation</button>
        <div id="reset-confirm" class="confirm-row hidden">
          <p>Clear all messages and restart mood &amp; memory? Name, personality, and avatar stay.</p>
          <div class="confirm-actions">
            <button type="button" id="reset-cancel-btn" class="ghost-btn">Cancel</button>
            <button type="button" id="reset-confirm-btn" class="confirm-solid-btn">Yes, reset</button>
          </div>
        </div>
        <button id="delete-btn" class="delete-persona-btn">Delete this persona</button>
      </div>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <button id="switch-persona-btn" class="switch-persona-btn" title="Switch persona">&larr;</button>
      <div class="companion-avatar" id="header-avatar"></div>
      <div class="companion-info">
        <div class="companion-name" id="header-name"></div>
        <div class="mood-bar-track">
          <div class="mood-bar-fill" id="mood-bar-fill"></div>
        </div>
      </div>
      <button id="edit-persona-btn" class="edit-persona-btn" title="Edit persona">&#9998;</button>
    </header>

    <div id="offline-banner" class="offline-banner hidden">You're offline — messages can't be sent right now.</div>

    <main id="messages" class="messages"></main>

    <div id="skip-to-panel" class="skip-to-panel hidden">
      <div class="skip-to-header">
        <span>Skip to…</span>
        <button type="button" id="skip-to-close" class="skip-to-close" title="Close">&times;</button>
      </div>
      <div id="skip-to-options" class="skip-to-options"></div>
      <form id="skip-to-form" class="skip-to-form">
        <input id="skip-to-input" type="text" autocomplete="off" placeholder="Or type your own moment…" />
        <button type="submit">Go</button>
      </form>
    </div>

    <!-- each data-command is sent as the message text; the commands are defined in instructions.txt -->
    <div id="command-bar" class="command-bar">
      <button type="button" class="command-btn primary" data-command="CONTINUE" title="Nothing to say? Let the scene keep going">&#9654; Continue</button>
      <button type="button" class="command-btn" id="do-btn" title="Describe something your character does, instead of says">&#128694; Do something</button>
      <button type="button" class="command-btn" data-command="SKIP TIME" title="Jump forward in time">&#9193; Skip time</button>
      <button type="button" class="command-btn" data-command="SKIP SCENE" title="Move to a new scene">&#127916; Skip scene</button>
      <button type="button" class="command-btn" id="skip-to-btn" title="Jump to a specific moment">&#127919; Skip to…</button>
      <button type="button" class="command-btn" data-command="RECAP" title="Summarize the scene so far">&#128221; Recap</button>
      <button type="button" class="command-btn" id="undo-last-turn-btn" title="Remove the last message and reply, and restore your message to the input">↶ Undo last turn</button>
    </div>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" autocomplete="off" placeholder="Say something..." />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
